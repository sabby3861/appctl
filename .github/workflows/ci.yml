name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    # macos-15 defaults to Xcode 16.4 (Swift 6.1); the package requires
    # swift-tools-version 6.2, so pin Xcode 26.3 which ships Swift 6.2.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: swift --version
      - run: swift build -c debug
      - run: swift test --parallel
  release:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: swift build -c release
      - run: .build/release/appctl version --short
