name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c debug
      - run: swift test --parallel
  release:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: .build/release/appctl version --short
