name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    # macos-15 ships Xcode 16 by default, which provides Swift 6 and the
    # `Testing` framework that the test target depends on.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build -c debug
      - run: swift test --parallel
  release:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release
      - run: .build/release/appctl version --short
